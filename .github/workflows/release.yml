name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  discussions: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version information
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${{ github.ref_name }}"
            # Check if tag contains pre-release identifiers
            if [[ "$TAG" == *"-"* ]]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          fi

          VERSION=${TAG#v}  # Remove 'v' prefix

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo "🏷️ Tag: $TAG"
          echo "📦 Version: $VERSION"
          echo "🧪 Pre-release: $IS_PRERELEASE"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Basic SemVer validation
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\-[0-9A-Za-z\-]+(\.[0-9A-Za-z\-]+)*)?(\+[0-9A-Za-z\-]+(\.[0-9A-Za-z\-]+)*)?$'; then
            echo "❌ Invalid version format: $VERSION"
            echo "Version must follow Semantic Versioning 2.0.0"
            exit 1
          fi
          echo "✅ Version format is valid"

      - name: Compute changelog range
        id: changelog_range
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -vFx "$TAG" | grep -v -- '-' | head -n1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            ARGS="--tag $TAG $PREV_TAG..HEAD"
          else
            ARGS="--tag $TAG"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        run: |
          git-cliff ${{ steps.changelog_range.outputs.args }} \
            --config cliff.toml \
            --output release_notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.is_prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG \
            "zig-toolchain.cmake"

  update-badges:
    name: Update Repository Badges
    needs: create-release
    runs-on: ubuntu-latest
    if: ${{ !needs.create-release.outputs.is_prerelease }}
    timeout-minutes: 5

    steps:
      - name: Update release badge cache
        run: |
          # Trigger shield.io cache refresh for release badge
          curl -X POST "https://img.shields.io/github/v/release/tayne3/zig-toolchain.cmake?include_prereleases&label=release&logo=github&logoColor=white"
          echo "🔄 Badge cache refresh triggered"

  notify-success:
    name: Notify Release Success
    needs: [create-release]
    runs-on: ubuntu-latest
    if: success()
    timeout-minutes: 2

    steps:
      - name: Success notification
        run: |
          echo "🎉 Successfully released zig-toolchain.cmake ${{ needs.create-release.outputs.version }}"
          echo "📦 Download URL: https://github.com/tayne3/zig-toolchain.cmake/releases/download/${{ needs.create-release.outputs.tag }}/zig-toolchain.cmake"
          echo "🔗 Release page: https://github.com/tayne3/zig-toolchain.cmake/releases/tag/${{ needs.create-release.outputs.tag }}"
